name = "myfirstbank-agent"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Set to the live GitHub Pages origin once known, e.g.
# "https://username.github.io" (no trailing slash, no path).
# Can also be set as a secret instead if you'd rather not commit it —
# `wrangler secret put ALLOWED_ORIGIN` — just remove the [vars] block below.
[vars]
ALLOWED_ORIGIN = "https://juanjochiarellar.github.io"

# Created via: wrangler kv namespace create RATE_LIMIT_KV
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "edd92865c31b437c800fcbd8fae4283f"
