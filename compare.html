<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare — MyFirstBank</title>
  <meta name="description" content="Compare up to 4 checking, savings, or credit card products side by side." />
  <link rel="icon" href="assets/logos/_mark.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Compare — MyFirstBank" />
  <meta property="og:description" content="Compare up to 4 checking, savings, or credit card products side by side." />
  <meta property="og:image" content="https://juanjochiarellar.github.io/my-first-bank/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://juanjochiarellar.github.io/my-first-bank/compare.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Compare — MyFirstBank" />
  <meta name="twitter:description" content="Compare up to 4 checking, savings, or credit card products side by side." />
  <meta name="twitter:image" content="https://juanjochiarellar.github.io/my-first-bank/assets/og-image.png" />

  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#FAFAF9',
            surface: '#FFFFFF',
            border: '#E4E3DD',
            ink: '#1F1F1D',
            'ink-secondary': '#6B6B65',
            'ink-placeholder': '#A3A29B',
            hover: '#F2F1EC',
            green: {
              fill: '#3FA76B',
              'fill-hover': '#2E9563',
              tint: '#E7F3EC',
              text: '#1F6B42',
            },
            // Compare-table-only: a cool slate-blue-gray family, deliberately
            // distinct from the warm `hover` (#F2F1EC) used everywhere else
            // on the site — reused here it would read as this site's own
            // neutral hover state rather than a real column/section
            // distinction. Not green: green stays reserved for eligibility
            // signals (the check badges, the logo) elsewhere on the site.
            divider: '#DDE3E9',
            'slot-empty': '#EAEEF2',
          },
          fontFamily: {
            display: ['Inter Tight', 'Inter', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body data-page="compare" class="bg-bg text-ink font-sans antialiased">
  <div id="site-navbar"></div>

  <main x-data="comparePage()" class="max-w-6xl mx-auto px-4 sm:px-6 py-10 min-h-[60vh]">
    <h1 class="font-display text-2xl sm:text-3xl font-semibold mb-2">Compare</h1>
    <p class="text-ink-secondary mb-8">Pick a product type, then fill in up to 4 columns — by picking a bank and product below, or with &ldquo;+ Compare&rdquo; from Browse Banks or a bank&rsquo;s page.</p>

    <div x-show="loading" class="text-ink-secondary text-sm">Loading&hellip;</div>

    <template x-if="!loading">
      <div>
        <!-- Type selector -->
        <section class="mb-6 flex items-end gap-3 flex-wrap">
          <div class="flex flex-col gap-1">
            <label for="cmp-type" class="text-xs font-medium text-ink-secondary">Product type to compare</label>
            <select id="cmp-type" x-model="selectedType"
                    class="border border-border rounded-md px-3 py-2 text-sm bg-surface min-w-[200px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
              <option value="" disabled>Choose a type&hellip;</option>
              <option value="checking">Checking</option>
              <option value="savings">Savings</option>
              <option value="credit_card">Credit card</option>
            </select>
          </div>
          <button type="button" @click="clearAll()" x-show="anyFilled()"
                  class="text-sm text-ink-secondary underline hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink rounded-sm px-1 py-2">
            Clear all
          </button>
        </section>

        <!-- No type chosen yet -->
        <div x-show="!selectedType" class="text-center py-16 border border-border rounded-lg bg-surface">
          <p class="text-ink-secondary">Choose a product type above to start comparing.</p>
        </div>

        <template x-if="selectedType">
          <div>
            <!-- Field selector, grouped into labeled sections -->
            <section class="mb-6 p-4 border border-border bg-surface rounded-lg">
              <h2 class="font-display text-sm font-semibold mb-3">Fields to show</h2>
              <template x-for="group in fieldDef().groups" :key="group.label">
                <div class="mb-4 last:mb-0">
                  <p class="text-xs font-medium text-ink-secondary mb-1.5" x-text="group.label"></p>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="field in group.fields" :key="field.key">
                      <label class="inline-flex items-center gap-1.5 text-xs border border-border rounded-full px-2.5 py-1 cursor-pointer hover:bg-hover has-[:checked]:bg-hover has-[:checked]:border-ink">
                        <input type="checkbox" class="accent-ink" :checked="isFieldSelected(field.key)" @change="toggleField(field.key)">
                        <span x-text="field.label"></span>
                      </label>
                    </template>
                  </div>
                </div>
              </template>
            </section>

            <p x-show="pickError" x-cloak class="mb-4 text-sm text-ink bg-hover border border-border rounded-md px-4 py-2.5" x-text="pickError"></p>

            <!-- Table: 4 fixed-width columns, always rendered. Each header
                 cell is filled / bank-pending / fully-empty (active slot
                 only) / inert — see js/compare.js. table-fixed + explicit
                 widths keep columns a constant size regardless of content,
                 so picking products never visibly resizes the table. -->
            <section class="overflow-x-auto border border-border rounded-lg bg-surface mb-8">
              <table class="w-full text-sm table-fixed">
                <colgroup>
                  <col class="w-32">
                  <col class="w-52"><col class="w-52"><col class="w-52"><col class="w-52">
                </colgroup>
                <thead>
                  <tr class="border-b border-border">
                    <th scope="col" class="text-left font-medium text-ink-secondary text-xs px-4 py-3 sticky left-0 bg-surface">Field</th>
                    <template x-for="i in slotIndices" :key="i">
                      <th scope="col" class="text-left font-medium px-3 py-3 align-top"
                          :class="slotAt(i).filled ? 'bg-white' : 'bg-slot-empty'">

                        <!-- Filled slot -->
                        <template x-if="slotAt(i).filled">
                          <div class="relative px-5">
                            <button type="button" @click="removeSlotEntirely(i)"
                                    class="absolute -top-1 -right-1 w-6 h-6 flex items-center justify-center rounded-full hover:bg-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
                                    :aria-label="`Remove ${slotAt(i).product.name} and its bank from comparison`">
                              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                            </button>
                            <div class="text-center">
                              <div class="text-ink-secondary text-xs truncate" x-text="slotAt(i).product.bank.name"></div>
                              <div class="font-display truncate" x-text="slotAt(i).product.name"></div>
                              <button type="button" @click="removeProductOnly(i)"
                                      class="text-[11px] text-ink-secondary underline hover:text-ink mt-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink rounded-sm">
                                Change product
                              </button>
                            </div>
                            <p x-show="slotAt(i).mismatched" class="text-xs font-normal text-center text-ink-secondary bg-hover rounded px-2 py-1 mt-2">
                              Doesn&rsquo;t match the selected type
                            </p>
                          </div>
                        </template>

                        <!-- Active slot, bank already chosen, product pending -->
                        <template x-if="!slotAt(i).filled && i === activeSlotIndex && slotBankPending[i]">
                          <div class="flex flex-col gap-1.5 font-normal border border-border rounded-md p-2.5 bg-surface">
                            <div class="flex items-center justify-between gap-2">
                              <span class="text-xs text-ink-secondary truncate" x-text="pendingBankName(i)"></span>
                              <button type="button" @click="clearPendingBank(i)"
                                      class="flex-shrink-0 w-5 h-5 flex items-center justify-center rounded-full hover:bg-hover text-ink-placeholder hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
                                      :aria-label="`Change bank for comparison slot ${i + 1}`">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                              </button>
                            </div>
                            <select :aria-label="`Product for comparison slot ${i + 1}`"
                                    @change="pickProduct(i, $event.target.value); $event.target.value = ''"
                                    class="border border-border rounded-md px-2 py-1.5 text-xs bg-surface focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
                              <option value="">Choose a product&hellip;</option>
                              <template x-for="p in productOptionsForSlot(i)" :key="p.product_id">
                                <option :value="p.product_id" x-text="p.name"></option>
                              </template>
                            </select>
                          </div>
                        </template>

                        <!-- Active slot, nothing chosen yet -->
                        <template x-if="!slotAt(i).filled && i === activeSlotIndex && !slotBankPending[i]">
                          <div class="flex flex-col gap-1.5 font-normal border border-border rounded-md p-2.5 bg-surface">
                            <select :aria-label="`Bank for comparison slot ${i + 1}`" x-model="slotBankPending[i]"
                                    class="border border-border rounded-md px-2 py-1.5 text-xs bg-surface focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
                              <option value="">Choose a bank&hellip;</option>
                              <template x-for="b in bankOptionsForPicker()" :key="b.bank_id">
                                <option :value="b.bank_id" x-text="b.name"></option>
                              </template>
                            </select>
                            <select disabled
                                    class="border border-border rounded-md px-2 py-1.5 text-xs bg-surface opacity-50 cursor-not-allowed">
                              <option value="">Choose a product&hellip;</option>
                            </select>
                          </div>
                        </template>

                        <!-- Inert future slot -->
                        <template x-if="!slotAt(i).filled && i !== activeSlotIndex">
                          <div class="bg-surface border border-dashed border-border rounded-md p-2.5 text-xs font-normal text-ink-placeholder text-center">
                            Fill the previous slot first
                          </div>
                        </template>

                      </th>
                    </template>
                  </tr>
                </thead>
                <!-- One <tbody> per group — a real full-width divider row,
                     not a small caption crowding the first data row. Tables
                     support multiple <tbody> elements natively. -->
                <template x-for="group in visibleFields()" :key="group.label">
                  <tbody>
                    <tr>
                      <th colspan="5" scope="colgroup"
                          class="text-left text-[11px] font-semibold uppercase tracking-wide text-ink-secondary px-4 py-2 bg-divider">
                        <span x-text="group.label"></span>
                      </th>
                    </tr>
                    <template x-for="field in group.fields" :key="field.key">
                      <tr class="border-b border-border last:border-b-0">
                        <th scope="row" class="text-left text-ink-secondary text-xs font-normal px-4 py-3 sticky left-0 bg-surface align-top" x-text="field.label"></th>
                        <template x-for="i in slotIndices" :key="i">
                          <td class="px-3 py-3 text-xs align-top"
                              :class="[(field.fmt !== 'list' && field.fmt !== 'programs') ? 'font-mono' : '', slotAt(i).filled ? 'bg-white' : 'bg-slot-empty']">
                            <template x-if="slotAt(i).filled && !slotAt(i).mismatched">
                              <div>
                                <template x-if="field.fmt === 'list' || field.fmt === 'programs'">
                                  <div class="flex flex-wrap gap-1.5">
                                    <template x-for="item in cellList(field, slotAt(i).product)" :key="item">
                                      <span class="inline-block bg-hover rounded-full px-2 py-0.5" x-text="item"></span>
                                    </template>
                                    <span x-show="!cellList(field, slotAt(i).product).length" class="text-ink-placeholder">None listed</span>
                                  </div>
                                </template>
                                <template x-if="field.fmt !== 'list' && field.fmt !== 'programs'">
                                  <span x-text="cellValue(field, slotAt(i).product)"></span>
                                </template>
                              </div>
                            </template>
                            <template x-if="!slotAt(i).filled || slotAt(i).mismatched">
                              <span class="text-ink-placeholder">&mdash;</span>
                            </template>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </template>
                <tbody>
                  <!-- last_verified_date always rendered, never optional -->
                  <tr>
                    <th scope="row" class="text-left text-ink-secondary text-xs font-normal px-4 py-3 sticky left-0 bg-surface">Last verified</th>
                    <template x-for="i in slotIndices" :key="i">
                      <td class="px-3 py-3 font-mono text-xs text-ink-placeholder"
                          :class="slotAt(i).filled ? 'bg-white' : 'bg-slot-empty'"
                          x-text="slotAt(i).filled && !slotAt(i).mismatched ? slotAt(i).product.last_verified_date : ''"></td>
                    </template>
                  </tr>
                </tbody>
              </table>
            </section>

            <p class="text-xs text-ink-placeholder mb-8">This table is generated directly from our dataset — no AI is involved. Always verify current terms with the bank before applying.</p>

            <div class="text-center" x-show="anyFilled()">
              <a :href="askAgentHref()"
                 class="inline-block bg-ink text-white text-sm font-medium rounded-md px-5 py-3 hover:bg-[#3A3A36] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
                Ask the Agent about these
              </a>
            </div>
          </div>
        </template>
      </div>
    </template>
  </main>

  <div id="site-footer"></div>

  <script src="js/data-loader.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>
