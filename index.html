<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFirstBank — Compare US banks for newcomers</title>
  <meta name="description" content="Compare US banks, digital banks, and fintechs as a newcomer to the US banking system — checking, savings, and credit card options with real eligibility details." />
  <link rel="icon" href="assets/logos/_mark.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#FAFAF9',
            surface: '#FFFFFF',
            border: '#E4E3DD',
            ink: '#1F1F1D',
            'ink-secondary': '#6B6B65',
            'ink-placeholder': '#A3A29B',
            hover: '#F2F1EC',
            green: {
              fill: '#3FA76B',
              'fill-hover': '#2E9563',
              tint: '#E7F3EC',
              text: '#1F6B42',
            },
          },
          fontFamily: {
            display: ['Inter Tight', 'Inter', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body data-page="home" class="bg-bg text-ink font-sans antialiased">
  <div id="site-navbar"></div>

  <main x-data="browseBanks()" class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    <!-- Hero -->
    <section class="max-w-3xl mb-8">
      <h1 class="font-display text-3xl sm:text-4xl font-semibold tracking-tight mb-3">Comparing US banks as a newcomer, made simple.</h1>
      <p class="text-ink-secondary text-base sm:text-lg">Whether you're arriving with no SSN yet or already have one, filter by what applies to you and see real checking, savings, and credit card details from 15 banks and fintechs — side by side.</p>
    </section>

    <!-- Filter: State is the only bank-level filter that's genuinely
         meaningful here (branch presence isn't visible anywhere else on the
         card). Product type / Documentation status were dropped — matching
         one product doesn't tell a user much before they click in and see
         the bank's full catalog anyway; both stay available in Ask the
         Agent's filtered search, where the agent can reason about which
         specific products match instead of a static list just gatekeeping
         which banks appear. -->
    <section class="flex items-end gap-3 mb-6 flex-wrap" aria-label="Filters">
      <div class="flex flex-col gap-1">
        <label for="f-state" class="text-xs font-medium text-ink-secondary">State</label>
        <select id="f-state" x-model="filters.state"
                class="border border-border rounded-md px-3 py-2 text-sm bg-surface min-w-[180px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <option value="any">Any state</option>
          <template x-for="[code, name] in usStates" :key="code">
            <option :value="code" x-text="name"></option>
          </template>
        </select>
      </div>
      <button type="button" @click="resetFilters()" x-show="filters.state !== 'any'"
              class="text-sm text-ink-secondary underline hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink rounded-sm px-1 py-2">
        Reset
      </button>
    </section>

    <!-- Loading state -->
    <div x-show="loading" class="text-ink-secondary text-sm">Loading institutions&hellip;</div>

    <!-- Results count -->
    <p x-show="!loading" class="text-sm text-ink-secondary mb-4" x-text="`${filteredBanks.length} institution${filteredBanks.length === 1 ? '' : 's'}`"></p>

    <!-- No results -->
    <div x-show="!loading && filteredBanks.length === 0" class="text-center py-16 text-ink-secondary">
      <p class="mb-3">No institutions match those filters.</p>
      <button type="button" @click="resetFilters()" class="text-sm underline text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink rounded-sm">Reset filters</button>
    </div>

    <!-- Grid -->
    <div x-show="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <template x-for="bank in filteredBanks" :key="bank.bank_id">
        <a :href="`banks/${bank.bank_id}.html`"
           class="group flex flex-col h-full text-center border border-border bg-surface rounded-lg p-4 hover:bg-hover transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <div class="mb-4">
            <div class="h-12 w-full rounded-md border border-border bg-white flex items-center justify-center px-3 mb-3 mx-auto">
              <img :src="`assets/logos/${bank.bank_id}.svg`" :alt="`${bank.name} logo`"
                   class="max-w-full max-h-8 object-contain"
                   onerror="this.src='assets/logos/_fallback.svg'; this.classList.add('max-h-6')">
            </div>
            <h2 class="font-display font-semibold text-ink leading-tight line-clamp-2 min-h-[2.5rem]" x-text="bank.name"></h2>
            <p class="text-xs text-ink-placeholder leading-tight" x-text="typeLabel(bank.type)"></p>
          </div>

          <template x-if="bank.type !== 'credit_history_bridge'">
            <div class="flex flex-col flex-1">
              <!-- Reserved 2-line height so 0, 1, 2, or 3 eligibility badges never
                   shift the footer below it — see Phase 8c card-alignment fix. -->
              <div class="flex flex-wrap justify-center gap-1.5 mb-4 min-h-[3.75rem] content-start">
                <template x-for="badge in badgesFor(bank)" :key="badge">
                  <span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-1 rounded-full bg-green-tint text-green-text h-fit">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    <span x-text="badge"></span>
                  </span>
                </template>
              </div>

              <!-- Always rendered (never x-show-gated) so every card's footer lands
                   at the same height regardless of whether a representative fee
                   was found — see Phase 8c card-alignment fix. -->
              <div class="mt-auto pt-3 border-t border-border">
                <p class="text-xs font-mono text-ink-secondary mb-2"
                   x-text="`${bank.num_checking_products ?? 0} Checking · ${bank.num_savings_products ?? 0} Savings · ${bank.num_credit_card_products ?? 0} Credit cards`"></p>
                <p class="text-sm font-mono font-medium"
                   x-text="representativeFee(bank.bank_id) ? `${representativeFee(bank.bank_id).label} monthly fee from $${representativeFee(bank.bank_id).amount}` : 'Contact bank for current pricing'"></p>
              </div>
            </div>
          </template>

          <template x-if="bank.type === 'credit_history_bridge'">
            <div class="flex flex-col flex-1">
              <span class="inline-block text-xs font-medium px-2 py-1 rounded-full bg-hover text-ink-secondary mb-3 mx-auto w-fit">Not a bank &mdash; credit history service</span>
              <p class="text-sm text-ink-secondary mt-auto" x-text="bank.description ? bank.description.slice(0, 90) + '…' : ''"></p>
            </div>
          </template>
        </a>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data-loader.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
