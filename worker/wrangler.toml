name = "myfirstbank-agent"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Set to the live GitHub Pages origin once known, e.g.
# "https://username.github.io" (no trailing slash, no path).
# Can also be set as a secret instead if you'd rather not commit it —
# `wrangler secret put ALLOWED_ORIGIN` — just remove the [vars] block below.
[vars]
ALLOWED_ORIGIN = "http://localhost:8765"

# Create with: wrangler kv:namespace create RATE_LIMIT_KV
# then paste the returned id below. Rate limiting fails open (allows
# requests) if this binding is missing, so the agent doesn't break if you
# skip this step — but do add it before sharing the site publicly.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
